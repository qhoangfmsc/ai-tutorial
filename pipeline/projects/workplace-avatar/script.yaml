title: "Hướng dẫn đổi avatar trên Workplace"
viewport:
  width: 1280
  height: 676
# voice: "Linh"
tts:
  provider: "omnivoice"
  voice: "chi-mai"
  language: "vi"

intro:
  heading: "Workplace"
  subheading: "Hướng dẫn đổi ảnh đại diện"
  narration: "Chào bạn! Trong video này, tôi sẽ hướng dẫn bạn cách đổi ảnh đại diện trên Workplace."
  durationMs: 2000

outro:
  heading: "Workplace"
  subheading: "Cảm ơn bạn đã theo dõi!"
  narration: "Vậy là xong! Cảm ơn bạn đã theo dõi hướng dẫn."
  durationMs: 2000

auth:
  storageState: "auth.json"

steps:
  - narration: "Vào trang Workplace, đã đăng nhập sẵn nhờ session lưu trước đó."
    caption: "Trang chủ Workplace"
    action:
      type: goto
      url: "https://workplace.vietnix.vn/"

  - narration: "Đưa chuột vào avatar người dùng trên thanh điều hướng."
    caption: "Mở menu tài khoản"
    highlight: false
    action:
      type: hover
      selector: "[aria-haspopup='list'][role='button']:has(.el-avatar.el-avatar--circle)"

  - narration: "Chọn 'Chỉnh sửa hồ sơ' trong menu vừa mở."
    caption: "Chọn 'Chỉnh sửa hồ sơ'"
    action:
      type: click
      find:
        text: "Chỉnh sửa hồ sơ"

  - narration: "Kéo xuống xem qua các thông tin có trong trang hồ sơ."
    caption: "Xem các thông tin cá nhân"
    highlight: false
    action:
      type: scroll
      selector: "textarea[placeholder='Description']"

  - narration: "Tên đăng nhập đang bị khoá, không thể chỉnh sửa trực tiếp ở đây."
    caption: "Username: không chỉnh được"
    action:
      type: hover
      selector: "input[placeholder='Username']"

  - narration: "Email cũng vậy, không sửa được."
    caption: "Email: không chỉnh được"
    action:
      type: hover
      selector: "input[placeholder='Email']"

  - narration: "Họ tên cũng đang bị khoá luôn."
    caption: "Name: không chỉnh được"
    action:
      type: hover
      selector: "input[placeholder='Name']"

  - narration: "Riêng ô Mô tả thì có thể chỉnh sửa bình thường."
    caption: "Description: chỉnh được"
    action:
      type: hover
      selector: "textarea[placeholder='Description']"

  - narration: "Nhưng hôm nay mình sẽ chỉ tập trung đổi ảnh đại diện thôi, nên kéo lên lại đầu trang."
    caption: "Kéo lên lại đầu trang"
    highlight: false
    action:
      type: scroll
      selector: "label[for='input-avatar']"

  - narration: "Nhấn vào biểu tượng bút chì trên ảnh đại diện, chọn ảnh mong muốn và bắt đầu cập nhật."
    caption: "Đổi ảnh đại diện"
    targetSelector: "label[for='input-avatar']"
    highlight: false
    action:
      type: upload
      selector: "#input-avatar"
      filePath: "~/Downloads/1.jpg"

  - narration: "Vậy là hoàn thành việc upload ảnh đại diện mới."
    caption: "Hoàn thành upload"
    action:
      type: wait
      ms: 800
